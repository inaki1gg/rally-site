<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>RALLY phone</title>
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;src:url("file:///home/user/rally-site/fonts/montserrat-latin-400-normal.woff2") format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;src:url("file:///home/user/rally-site/fonts/montserrat-latin-700-normal.woff2") format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:900;src:url("file:///home/user/rally-site/fonts/montserrat-latin-900-normal.woff2") format('woff2')}
:root{
  --acid:#CCFF00; --bg:#0D0D0D; --card:#141414; --card2:#181818;
  --line:#242424; --ink:#F5F5F5; --mut:#8F8F8F; --dim:#5C5C5C;
  --font:'Montserrat',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:var(--font);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:427px;height:886px}

/* ---------- chassis ---------- */
.phone{position:absolute;left:3px;top:3px;width:421px;height:880px}
.chassis{
  position:absolute;inset:0;border-radius:64px;
  background:linear-gradient(155deg,#3d3f42 0%,#17181a 22%,#0a0a0b 50%,#1b1c1e 78%,#333538 100%);
  box-shadow:0 40px 90px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.14);
}
.bezel{position:absolute;inset:4px;border-radius:60px;background:#000;}
.screen{
  position:absolute;left:14px;top:14px;width:393px;height:852px;border-radius:50px;
  background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;
}
.sidebtn{position:absolute;background:linear-gradient(90deg,#26272a,#101113);border-radius:3px}
.sb-l{left:-2.5px;width:3.5px}
.sb-r{right:-2.5px;width:3.5px}
.action{top:196px;height:30px}
.vol1{top:252px;height:56px}
.vol2{top:322px;height:56px}
.power{top:278px;height:90px}
.island{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:122px;height:35px;border-radius:20px;background:#000;z-index:40;
}
.island::after{content:'';position:absolute;right:13px;top:50%;transform:translateY(-50%);
  width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1e2733,#05070a 65%)}

/* ---------- status bar ---------- */
.status{display:flex;justify-content:space-between;align-items:center;
  padding:16px 34px 0 40px;height:52px;flex:none;position:relative;z-index:50}
.time{font-weight:700;font-size:16.5px;letter-spacing:.2px;color:var(--ink)}
.sicons{display:flex;align-items:center;gap:7px}
.sicons svg{display:block}

/* ---------- header ---------- */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 0;flex:none}
.wordmark{font-weight:900;font-size:29px;letter-spacing:1.5px;color:var(--ink)}
.wordmark b{color:var(--acid);font-weight:900}
.hright{display:flex;align-items:center;gap:12px}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:#151515;
  display:flex;align-items:center;justify-content:center;border:1px solid #1f1f1f}
.bell .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--acid);box-shadow:0 0 6px var(--acid)}
.avatar{width:38px;height:38px;border-radius:50%;background:#1d1d1d;border:1px solid #2a2a2a;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#cfcfcf;letter-spacing:.5px}
.dateline{padding:10px 24px 2px;text-align:right;flex:none;
  font-size:10.5px;font-weight:700;letter-spacing:2.6px;color:var(--dim)}

/* ---------- hero card ---------- */
.hero{
  margin:12px 18px 0;border-radius:26px;padding:22px 22px 24px;flex:none;
  background:linear-gradient(180deg,#121307 0%,#101010 40%,#0f0f0f 100%);
  border:1.5px solid var(--acid);
  box-shadow:0 0 26px rgba(204,255,0,.16), inset 0 0 44px rgba(204,255,0,.045);
}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hlabel{font-size:12px;font-weight:700;letter-spacing:3.4px;color:var(--mut)}
.pill{display:flex;align-items:center;gap:7px;background:#1a1c0c;border:1px solid rgba(204,255,0,.35);
  border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:700;letter-spacing:1.6px;color:var(--acid)}
.pill .pd{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 6px var(--acid)}
.rating{margin-top:10px;font-weight:900;font-size:88px;line-height:1.02;letter-spacing:-1px;
  color:var(--acid);text-shadow:0 0 34px rgba(204,255,0,.35)}
.sub{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;white-space:nowrap}
.sub .up{color:var(--acid);font-weight:900}
.sub .g{color:var(--mut);font-weight:400}
.sub .sep{color:#3a3a3a}
.verif{display:inline-flex;align-items:center;gap:5px;margin-left:2px;
  border:1px solid rgba(204,255,0,.4);border-radius:5px;padding:2.5px 7px;
  font-size:9px;font-weight:900;letter-spacing:1.8px;color:var(--acid)}
.track{position:relative;margin-top:24px;height:4px;border-radius:2px;background:#232323}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:46%;border-radius:2px;
  background:linear-gradient(90deg,#5d7500,var(--acid))}
.track .tick{position:absolute;top:-3px;width:1.5px;height:10px;background:#333}
.track .knob{position:absolute;left:46%;top:50%;transform:translate(-50%,-50%);
  width:17px;height:17px;border-radius:50%;background:var(--acid);
  box-shadow:0 0 0 5px rgba(204,255,0,.15),0 0 16px rgba(204,255,0,.75)}
.tlabels{display:flex;margin-top:12px;font-size:11.5px;letter-spacing:.6px;color:var(--dim);font-weight:700}
.tlabels span{width:25%}
.tlabels .on{color:var(--ink)}
.hfoot{margin-top:12px;font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.8px}
.hfoot b{color:var(--acid)}

/* ---------- stat cards ---------- */
.cards{display:flex;gap:12px;margin:14px 18px 0;flex:none}
.card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px 18px 15px}
.clabel{font-size:10.5px;font-weight:700;letter-spacing:2.8px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.mini{background:#1a1c0c;border:1px solid rgba(204,255,0,.3);color:var(--acid);
  border-radius:999px;padding:2.5px 9px;font-size:10px;font-weight:900;letter-spacing:.5px}
.big{margin-top:8px;font-weight:900;font-size:42px;line-height:1;color:var(--ink);letter-spacing:-.5px}
.big small{font-size:20px;font-weight:900;color:#d9d9d9}
.big .dash{color:#4a4a4a;font-weight:700}
.cfoot{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--dim)}
.boxes{display:flex;gap:7px;margin-top:10px}
.bx{width:21px;height:21px;border-radius:6px;background:#0e0e0e;border:1px solid #262626}
.bx.w{background:var(--acid);border-color:var(--acid);display:flex;align-items:center;justify-content:center}

/* ---------- recent ---------- */
.seclabel{margin:20px 24px 0;font-size:11px;font-weight:700;letter-spacing:3.2px;color:var(--dim);flex:none}
.recent{margin:10px 18px 0;flex:none;display:flex;flex-direction:column;gap:9px}
.match{display:flex;align-items:center;gap:13px;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:15px 17px}
.wbadge{width:30px;height:30px;border-radius:9px;background:var(--acid);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:900;color:#0D0D0D}
.minfo{flex:1;min-width:0}
.mname{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden}
.mname i{font-style:normal;color:var(--dim);font-weight:400;margin-right:5px;font-size:12.5px}
.mago{margin-top:3px;font-size:9.5px;font-weight:700;letter-spacing:2.2px;color:var(--dim)}
.mscore{font-size:14.5px;font-weight:900;color:var(--ink);letter-spacing:.5px;display:flex;gap:11px}

/* ---------- tab bar ---------- */
.tabwrap{margin-top:auto;flex:none;padding:0 20px 18px}
.tabbar{height:64px;border-radius:999px;background:rgba(22,22,22,.92);border:1px solid #232323;
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.tab{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tab.active{background:#262626}
.fab{width:52px;height:52px;border-radius:50%;background:var(--acid);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 22px rgba(204,255,0,.45)}
.homedot{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:120px;height:4.5px;border-radius:3px;background:#3a3a3a;z-index:60}
</style></head>
<body>
