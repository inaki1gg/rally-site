<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@font-face{font-family:'Montserrat';font-weight:700;src:url("file:///home/user/rally-site/fonts/montserrat-latin-700-normal.woff2") format('woff2')}
@font-face{font-family:'Montserrat';font-weight:900;src:url("file:///home/user/rally-site/fonts/montserrat-latin-900-normal.woff2") format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1350px;background:
  radial-gradient(90% 60% at 50% 44%, #0b0b0b 0%, #050505 70%)}
.lockup{position:absolute;top:92px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}
.wm{font-weight:900;font-size:34px;letter-spacing:3px;color:#F2F2F2}

.handle{font-weight:700;font-size:19px;letter-spacing:3.5px;color:#8F8F8F}
.hero{position:absolute;top:388px;left:0;right:0;text-align:center;font-weight:900;
  font-size:158px;line-height:.94;letter-spacing:-2px;color:#F2F2F2}
.hero .acid{color:#CCFF00;text-shadow:0 0 60px rgba(204,255,0,.25)}
.cta{position:absolute;top:948px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:26px}
.pill{display:inline-block;border:2px solid rgba(204,255,0,.55);border-radius:999px;
  padding:16px 34px;color:#CCFF00;font-weight:700;font-size:21px;letter-spacing:3.5px}
.sub{color:#8F8F8F;font-weight:700;font-size:16px;letter-spacing:3.5px}
.foot{position:absolute;bottom:70px;left:0;right:0;text-align:center;
  color:#565656;font-weight:700;font-size:14px;letter-spacing:3px}

<body>
<div id="stage">
  <div class="lockup">
    <span class="wm">RALL<b>Y</b></span>

    <span class="handle">@RALLYRATING.APP</span>
  </div>
  <div class="hero">BRAND<br>NEW<br><span class="acid">GAME.</span></div>
  <div class="cta">
    <span class="pill">FOUNDING 100 · MADRID</span>
    <span class="sub">SOLICITA ACCESO — LINK EN LA BIO</span>
  </div>
  <div class="foot">@RALLYRATING.APP</div>
</div>
</body></html>
