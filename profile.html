<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RALLY — Player Profile</title>
  <meta name="description" content="View your padel rating and stats on Rally.">
  <meta property="og:title" content="RALLY — Player Profile">
  <meta property="og:description" content="See your padel rating, ranking, and stats on Rally.">
  <meta property="og:image" content="https://rallyrating.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0D0D0D;
      --acid:     #CCFF00;
      --white:    #F2F2F0;
      --grey:     #888;
      --grey-dim: #555;
      --card:     #161616;
      --card-border: #242424;
    }

    html { background: var(--black); }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    /* ── Loading ─────────────────────────────── */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; background: var(--black);
      z-index: 100;
      transition: opacity 0.3s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .wordmark {
      font-size: 52px; font-weight: 900;
      letter-spacing: -3px; color: var(--white);
      line-height: 1;
    }
    .wordmark em { color: var(--acid); font-style: normal; }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid #2a2a2a;
      border-top-color: var(--acid);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Not-found ───────────────────────────── */
    #notfound {
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh;
      gap: 20px; text-align: center;
      padding: 40px 32px;
    }
    #notfound.visible { display: flex; }

    .nf-message {
      font-size: 16px; font-weight: 500;
      color: var(--grey); max-width: 260px; line-height: 1.6;
    }

    /* ── Profile page ────────────────────────── */
    #profile {
      display: none;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 20px 56px;
    }
    #profile.visible { display: block; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 20px 0 12px;
    }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: 100px;
      border: 1.5px solid #3a3a3a;
      background: transparent;
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      cursor: pointer; text-decoration: none;
      transition: border-color 0.18s;
      white-space: nowrap;
    }
    .pill:hover { border-color: #666; }
    .pill.acid {
      background: var(--acid); border-color: var(--acid);
      color: #0D0D0D;
    }
    .pill.acid:hover { background: #b8e600; border-color: #b8e600; }

    /* Avatar */
    .avatar-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      padding-top: 20px;
    }

    .avatar {
      width: 92px; height: 92px;
      background: #1e1e1e;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800;
      letter-spacing: 1px; color: var(--white);
      flex-shrink: 0;
    }

    .player-name {
      font-size: 26px; font-weight: 700;
      color: var(--white); text-align: center;
      line-height: 1.25; letter-spacing: -0.3px;
    }

    .player-meta {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 5px;
      font-size: 13px; font-weight: 500;
      color: var(--grey); text-align: center;
      margin-top: 2px;
    }
    .meta-dot { color: #3a3a3a; }

    /* Rating */
    .rating-wrap {
      text-align: center;
      margin-top: 28px;
    }

    .rating-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 3px; color: #555;
      text-transform: uppercase; margin-bottom: 2px;
    }

    .rating-num {
      font-size: 96px; font-weight: 900;
      line-height: 1; letter-spacing: -5px;
      color: var(--acid);
      text-shadow:
        0 0 40px rgba(204,255,0,0.55),
        0 0 100px rgba(204,255,0,0.20),
        0 0 200px rgba(204,255,0,0.08);
    }

    /* Rank pills */
    .rank-row {
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
      margin-top: 18px;
    }

    .rank-pill {
      padding: 8px 18px; border-radius: 100px;
      font-size: 12px; font-weight: 800;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .rank-pill.country {
      background: var(--acid); color: #0D0D0D;
    }
    .rank-pill.global {
      background: rgba(204,255,0,0.08);
      border: 1.5px solid rgba(204,255,0,0.6);
      color: var(--acid);
    }

    /* Form */
    .section { margin-top: 28px; }

    .form-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .form-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; color: #555;
      text-transform: uppercase;
    }
    .form-status {
      font-size: 14px; font-weight: 600;
      color: var(--white);
    }

    .form-bar-outer {
      position: relative;
      height: 8px;
      border-radius: 100px;
      background: linear-gradient(
        to right,
        #3B82F6 0%,
        #06B6D4 22%,
        #22C55E 50%,
        #A3E635 75%,
        #CCFF00 100%
      );
      overflow: visible;
    }

    /* tick marks */
    .form-bar-outer::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 100px;
      background:
        repeating-linear-gradient(
          to right,
          transparent 0px,
          transparent calc(33.33% - 0.75px),
          rgba(0,0,0,0.35) calc(33.33% - 0.75px),
          rgba(0,0,0,0.35) calc(33.33% + 0.75px),
          transparent calc(33.33% + 0.75px),
          transparent calc(66.66% - 0.75px),
          rgba(0,0,0,0.35) calc(66.66% - 0.75px),
          rgba(0,0,0,0.35) calc(66.66% + 0.75px),
          transparent calc(66.66% + 0.75px),
          transparent 100%
        );
    }

    .form-marker {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 3px; height: 22px;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(255,255,255,0.6);
      transition: left 0.4s ease;
    }

    .form-scale {
      display: flex; justify-content: space-between;
      margin-top: 7px;
    }
    .form-scale span {
      font-size: 11px; font-weight: 600; color: #555;
    }
    .form-scale .cold  { color: #3B82F6; }
    .form-scale .scorch { color: var(--acid); }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 36px; font-weight: 700;
      color: var(--white); line-height: 1;
    }
    .stat-lbl {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; color: #555;
      text-transform: uppercase; margin-top: 6px;
    }

    /* Streak card */
    .streak-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px 14px;
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      row-gap: 2px;
    }

    .streak-header {
      display: flex; align-items: center; gap: 8px;
    }
    .streak-icon { font-size: 20px; line-height: 1; }
    .streak-lbl {
      font-size: 10px; font-weight: 700;
      letter-spacing: 2px; color: #555;
      text-transform: uppercase;
    }
    .streak-best-lbl {
      font-size: 10px; font-weight: 700;
      letter-spacing: 2px; color: #555;
      text-transform: uppercase;
      text-align: right;
    }
    .streak-num {
      font-size: 52px; font-weight: 700;
      color: var(--white); line-height: 1.1;
    }
    .streak-best-num {
      font-size: 52px; font-weight: 700;
      color: var(--white); line-height: 1.1;
      text-align: right;
    }

    /* Level card */
    .level-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: 8px;
    }

    .level-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .level-title {
      font-size: 15px; font-weight: 800;
      color: var(--white);
    }
    .level-sub {
      font-size: 12px; font-weight: 500; color: #555;
    }
    .level-bar-bg {
      height: 5px; background: #2a2a2a; border-radius: 100px;
    }
    .level-bar-fill {
      height: 100%; border-radius: 100px;
      background: var(--acid);
    }

    /* CTA */
    .cta-wrap {
      text-align: center; margin-top: 44px;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #1c1c1c; border: 1px solid #333;
      color: var(--white); padding: 11px 22px;
      border-radius: 100px;
      font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; white-space: nowrap; z-index: 999;
    }
    #toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- Loading splash -->
<div id="splash">
  <div class="wordmark">RALL<em>Y</em></div>
  <div class="spinner"></div>
</div>

<!-- Not found -->
<div id="notfound">
  <div class="wordmark">RALL<em>Y</em></div>
  <p class="nf-message" id="nf-msg">This player isn't on Rally yet.</p>
  <a class="pill acid" href="https://rallyrating.app" style="font-size:13px;padding:12px 28px;">
    Download Rally
  </a>
</div>

<!-- Profile -->
<div id="profile">
  <!-- Top bar -->
  <div class="topbar">
    <button class="pill" onclick="copyURL()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      Share
    </button>
    <a class="pill acid" href="https://rallyrating.app">Download Rally</a>
  </div>

  <!-- Avatar + name + meta -->
  <div class="avatar-wrap">
    <div class="avatar" id="p-avatar"></div>
    <div>
      <div class="player-name" id="p-name"></div>
      <div class="player-meta" id="p-meta"></div>
    </div>
  </div>

  <!-- Rating -->
  <div class="rating-wrap">
    <div class="rating-label">Padel Rating</div>
    <div class="rating-num" id="p-rating"></div>
  </div>

  <!-- Rank pills -->
  <div class="rank-row">
    <div class="rank-pill country" id="p-rank-country"></div>
    <div class="rank-pill global"  id="p-rank-global"></div>
  </div>

  <!-- Form -->
  <div class="section">
    <div class="form-header">
      <span class="form-title">Form</span>
      <span class="form-status" id="p-form-status"></span>
    </div>
    <div class="form-bar-outer">
      <div class="form-marker" id="p-form-marker"></div>
    </div>
    <div class="form-scale">
      <span class="cold">COLD</span>
      <span>Warming</span>
      <span>Hot</span>
      <span class="scorch">SCORCH</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="section">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="p-matches"></div>
        <div class="stat-lbl">Matches</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="p-winrate"></div>
        <div class="stat-lbl">Win Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="p-rivals"></div>
        <div class="stat-lbl">Rivals</div>
      </div>
    </div>
  </div>

  <!-- Streak -->
  <div class="streak-card">
    <div class="streak-header">
      <span class="streak-icon">🔥</span>
      <span class="streak-lbl">Week Streak</span>
    </div>
    <div class="streak-best-lbl">Best</div>
    <div class="streak-num"  id="p-streak"></div>
    <div class="streak-best-num" id="p-streak-best"></div>
  </div>

  <!-- Level -->
  <div class="level-card">
    <div class="level-header">
      <span class="level-title" id="p-level-title"></span>
      <span class="level-sub"   id="p-level-sub"></span>
    </div>
    <div class="level-bar-bg">
      <div class="level-bar-fill" id="p-level-bar"></div>
    </div>
  </div>

  <!-- Bottom CTA -->
  <div class="cta-wrap">
    <a class="pill acid" href="https://rallyrating.app"
       style="font-size:13px;padding:14px 32px;">
      Download Rally
    </a>
  </div>
</div>

<div id="toast"></div>

<script>
  // ─── Config ──────────────────────────────────────────────────────────────
  const SUPABASE_REF      = 'sbosbkbrkicpyktrzgjo';
  // Paste your anon key below (safe to expose; RLS protects the data):
  const SUPABASE_ANON_KEY = window.__RALLY_SUPABASE_ANON_KEY__ || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNib3Nia2Jya2ljcHlrdHJ6Z2pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNDA1OTQsImV4cCI6MjA4OTkxNjU5NH0.3UKDbRaoZpLChArFy3UD4LByadpvuawXMmmCwmK-tu4';

  const BASE    = `https://${SUPABASE_REF}.supabase.co/rest/v1`;
  const HEADERS = {
    apikey:        SUPABASE_ANON_KEY,
    Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
  };

  // ─── URL ─────────────────────────────────────────────────────────────────
  function getUsername() {
    const seg = window.location.pathname.split('/').filter(Boolean)[0] || '';
    return seg.replace(/\.html$/, '').toLowerCase();
  }

  // ─── Helpers ─────────────────────────────────────────────────────────────
  function initials(name) {
    if (!name) return '??';
    const parts = name.trim().split(/\s+/);
    return parts.length === 1
      ? parts[0].slice(0, 2).toUpperCase()
      : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  const FLAGS = {
    'Spain':'🇪🇸','United States':'🇺🇸','USA':'🇺🇸','United Kingdom':'🇬🇧',
    'UK':'🇬🇧','France':'🇫🇷','Germany':'🇩🇪','Italy':'🇮🇹','Netherlands':'🇳🇱',
    'Portugal':'🇵🇹','Belgium':'🇧🇪','Sweden':'🇸🇪','Norway':'🇳🇴','Denmark':'🇩🇰',
    'Finland':'🇫🇮','Switzerland':'🇨🇭','Austria':'🇦🇹','Argentina':'🇦🇷',
    'Brazil':'🇧🇷','Mexico':'🇲🇽','Australia':'🇦🇺','Canada':'🇨🇦','Japan':'🇯🇵',
    'China':'🇨🇳','India':'🇮🇳','Poland':'🇵🇱','Russia':'🇷🇺','UAE':'🇦🇪',
    'United Arab Emirates':'🇦🇪','Saudi Arabia':'🇸🇦','Morocco':'🇲🇦',
    'Egypt':'🇪🇬','South Africa':'🇿🇦','Chile':'🇨🇱','Colombia':'🇨🇴',
    'Peru':'🇵🇪','Uruguay':'🇺🇾','Ireland':'🇮🇪','Greece':'🇬🇷','Turkey':'🇹🇷',
  };
  function flag(country) { return FLAGS[country] || '🌍'; }

  function memberSince(iso) {
    return new Date(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function formStatus(pct) {
    if (pct >= 80) return 'Absolutely Scorching';
    if (pct >= 68) return 'On a Heater';
    if (pct >= 54) return 'Heating Up';
    if (pct >= 38) return 'Warming Up';
    return 'Running Cold';
  }

  function level(matches) {
    // Boundaries: L1=0, L2=6, L3=18, L4=30, … (+12 each after the first)
    const bounds = [0, 6];
    while (bounds[bounds.length - 1] <= matches + 12) {
      bounds.push(bounds[bounds.length - 1] + 12);
    }
    let lvl = 1;
    for (let i = 1; i < bounds.length; i++) {
      if (matches >= bounds[i]) lvl = i + 1; else break;
    }
    const start    = bounds[lvl - 1] ?? 0;
    const end      = bounds[lvl]     ?? start + 12;
    const width    = end - start;
    const progress = width > 0 ? (matches - start) / width : 0;
    const left     = Math.max(0, end - matches);
    return { lvl, progress: Math.max(0, Math.min(1, progress)), left };
  }

  function countryAbbr(country) {
    const MAP = {
      'Spain':'SPAIN','United States':'USA','USA':'USA',
      'United Kingdom':'UK','UK':'UK','France':'FRANCE',
      'Germany':'GER','Italy':'ITALY','Netherlands':'NED',
      'Portugal':'PORT','Argentina':'ARG','Brazil':'BRA',
      'Australia':'AUS','Canada':'CAN','Sweden':'SWE',
    };
    return MAP[country] || (country || 'LOCAL').slice(0,6).toUpperCase();
  }

  // ─── Supabase ─────────────────────────────────────────────────────────────
  async function countHigher(field, value, extraFilter) {
    let url = `${BASE}/profiles?${field}=gt.${value}&select=id`;
    if (extraFilter) url += `&${extraFilter}`;
    const res = await fetch(url, {
      headers: { ...HEADERS, Prefer: 'count=exact', Range: '0-0' },
    });
    const cr  = res.headers.get('content-range') || '';
    const m   = cr.match(/\/(\d+|\*)$/);
    return m && m[1] !== '*' ? parseInt(m[1], 10) : 0;
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function hideSplash() {
    const s = document.getElementById('splash');
    s.classList.add('hidden');
    setTimeout(() => s.style.display = 'none', 350);
  }

  function showNotFound(username) {
    document.title = 'RALLY — Player Not Found';
    if (username) {
      document.getElementById('nf-msg').textContent =
        `@${username} isn't on Rally yet.`;
    }
    hideSplash();
    document.getElementById('notfound').classList.add('visible');
  }

  function showProfile(p, globalRank, countryRank) {
    const rating    = p.padel_rating || p.rating || 1200;
    const winPct    = p.matches_played > 0
                      ? Math.round((p.wins / p.matches_played) * 100)
                      : 0;
    const formPos   = Math.max(3, Math.min(97, winPct));
    const lvl       = level(p.matches_played);
    const abbr      = countryAbbr(p.country);

    document.title = `${p.full_name || p.username} — RALLY`;

    document.getElementById('p-avatar').textContent  = initials(p.full_name);
    document.getElementById('p-name').textContent    = p.full_name || p.username;

    document.getElementById('p-meta').innerHTML =
      `<span>@${p.username}</span>`
      + `<span class="meta-dot">·</span>`
      + `<span>${flag(p.country)}</span>`
      + `<span class="meta-dot">·</span>`
      + `<span>Member since ${memberSince(p.created_at)}</span>`;

    document.getElementById('p-rating').textContent =
      rating.toLocaleString('en-US');

    document.getElementById('p-rank-country').textContent = `#${countryRank} ${abbr}`;
    document.getElementById('p-rank-global').textContent  = `#${globalRank} GLOBAL`;

    document.getElementById('p-form-status').textContent = formStatus(winPct);
    document.getElementById('p-form-marker').style.left  = `${formPos}%`;

    document.getElementById('p-matches').textContent = p.matches_played;
    document.getElementById('p-winrate').textContent = winPct + '%';
    document.getElementById('p-rivals').textContent  = '—';

    document.getElementById('p-streak').textContent      = p.current_week_streak;
    document.getElementById('p-streak-best').textContent = p.max_week_streak;

    document.getElementById('p-level-title').textContent =
      `LEVEL ${lvl.lvl}`;
    document.getElementById('p-level-sub').textContent   =
      `${lvl.left} match${lvl.left === 1 ? '' : 'es'} to lvl ${lvl.lvl + 1}`;
    document.getElementById('p-level-bar').style.width   =
      `${Math.round(lvl.progress * 100)}%`;

    hideSplash();
    document.getElementById('profile').classList.add('visible');
  }

  // ─── Share ────────────────────────────────────────────────────────────────
  function copyURL() {
    const url = window.location.href;
    if (navigator.share) {
      navigator.share({ title: document.title, url }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }

  function fallbackCopy(url) {
    navigator.clipboard.writeText(url).then(() => toast('Link copied!')).catch(() => {});
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2400);
  }

  // ─── Init ─────────────────────────────────────────────────────────────────
  (async function init() {
    const username = getUsername();

    if (!username) {
      window.location.replace('/');
      return;
    }

    try {
      const res  = await fetch(
        `${BASE}/profiles?username=eq.${encodeURIComponent(username)}&select=*`,
        { headers: HEADERS }
      );
      const rows = await res.json();

      if (!Array.isArray(rows) || rows.length === 0) {
        showNotFound(username);
        return;
      }

      const p      = rows[0];
      const rating = p.padel_rating || p.rating || 1200;
      const ctry   = encodeURIComponent(p.country || '');

      const [gCount, cCount] = await Promise.all([
        countHigher('padel_rating', rating),
        countHigher('padel_rating', rating, `country=eq.${ctry}`),
      ]);

      showProfile(p, gCount + 1, cCount + 1);
    } catch (err) {
      console.error('[RALLY profile]', err);
      showNotFound(username);
    }
  })();
</script>
</body>
