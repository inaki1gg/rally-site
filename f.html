<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Add me on RALLY</title>
<meta name="description" content="A friend sent you their RALLY link. Open it with Rally and you're friends straight away." />
<meta property="og:title" content="Add me on RALLY" />
<meta property="og:description" content="Open it with Rally and you're on each other's Rank." />
<!--
  RALLY · Friend link (/f/CODE, rewritten here by vercel.json)

  Sent from Share your link on the app's Friends page. When Rally is installed
  the phone opens the app directly (apple-app-site-association lists /f/*, the
  Android app link lists /f/) and the two become friends at once, no request.

  Without Rally: an iPhone goes straight to the App Store; Android goes through
  an intent (Rally if it's there, Google Play if not). A computer sees whose
  link it is and the code. Reads friend_link_preview(): first name, rating if
  it's settled, city. Never anyone else.
-->
<style>
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/montserrat-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/montserrat-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:900;font-display:swap;src:url('/fonts/montserrat-latin-900-normal.woff2') format('woff2');}
  :root{
    --bg:#080808;--surf:#141414;--surf-2:#1A1A1A;--line-2:#2A2A2A;
    --text:#F2F2F0;--dim:#888888;--muted:#555555;--acid:#CCFF00;
    --band:#D9D9D4;--ink:#0D0D0D;
    --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center}
  a{color:inherit;text-decoration:none}
  main{width:100%;max-width:460px;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:22px}
  .mark{font-weight:900;font-size:20px;letter-spacing:.18em}
  .eyebrow{font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  h1{font-weight:900;font-size:30px;line-height:1.08;letter-spacing:-.03em;text-wrap:balance}
  p.lede{font-size:15px;line-height:1.5;color:var(--dim)}
  .group{border-radius:22px;overflow:hidden;background:var(--surf);border:.5px solid var(--line-2)}
  .band{background:var(--band);color:var(--ink);padding:20px 20px 26px}
  .band small{display:block;font-weight:700;font-size:11px;letter-spacing:.14em;opacity:.72}
  .band b{display:block;margin-top:6px;font-weight:900;font-size:32px;line-height:1.08;letter-spacing:-.035em;overflow-wrap:anywhere}
  .group p{padding:16px 20px;font-size:14px;line-height:1.5;color:var(--dim)}
  .btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;font-weight:900;font-size:15px;letter-spacing:-.01em;border:0;cursor:pointer;width:100%;text-align:center}
  .btn.primary{background:var(--acid);color:#080808}
  .btn.quiet{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:14px}
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .code{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border:.5px solid var(--line-2);border-radius:14px;padding:14px 16px}
  .code b{display:block;font-weight:900;font-size:26px;letter-spacing:.22em;margin-top:4px;user-select:all}
  .code button{background:none;border:0;color:var(--dim);font:700 13px var(--font);cursor:pointer;padding:8px}
  .note{font-size:13px;line-height:1.5;color:var(--muted);text-align:center}
  .skeleton{background:var(--surf);border-radius:12px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="mark">RALLY</div>

  <section id="loading" aria-busy="true" style="display:flex;flex-direction:column;gap:14px">
    <div class="skeleton" style="height:12px;width:90px"></div>
    <div class="skeleton" style="height:180px;width:100%;border-radius:22px"></div>
  </section>

  <section id="content" hidden style="display:flex;flex-direction:column;gap:22px">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="group" id="card" hidden>
      <div class="band" id="band"><small id="meta"></small><b id="name"></b></div>
      <p id="what"></p>
    </div>
    <div id="missing" hidden style="display:flex;flex-direction:column;gap:10px">
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="actions" id="actions">
      <a class="btn primary" id="storeBtn" href="#"></a>
      <a class="btn quiet" id="openBtn" href="#"></a>
      <p class="note" id="note"></p>
    </div>
  </section>
</main>

<script>
(function () {
  var SUPABASE_URL = 'https://sbosbkbrkicpyktrzgjo.supabase.co';
  var KEY = 'sb_publishable_XLcXQNlCkK6xgNUkcn1wZQ_Lfp_rq5F';
  var APP_STORE = 'https://apps.apple.com/app/id6780019919';
  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=app.rallyrating';

  var es = /^es\b/i.test(navigator.language || '');
  document.documentElement.lang = es ? 'es' : 'en';
  var T = es ? {
    eyebrow: 'Te han enviado su enlace', what: 'Ábrelo con Rally y sois amigos al momento. Os veréis en el ranking del otro.',
    open: 'Abrir en Rally', getIos: 'Descargar en App Store', getAndroid: 'Descargar en Google Play', get: 'Descargar Rally',
    note: 'Con Rally instalado, vuelve a tocar el enlace.',
    notFound: 'Ningún jugador con este enlace', notFoundLede: 'Revisa el enlace o pide que te lo vuelvan a enviar.'
  } : {
    eyebrow: 'A friend sent you their link', what: 'Open it with Rally and you’re friends straight away. You’ll be on each other’s Rank.',
    open: 'Open in Rally', getIos: 'Get it on the App Store', getAndroid: 'Get it on Google Play', get: 'Get Rally',
    note: 'With Rally installed, tap the link again.',
    notFound: 'No player at this link', notFoundLede: 'Check the link, or ask for it to be sent again.'
  };

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIos = /iPhone|iPad|iPod/i.test(ua);
  var m = /\/f\/([A-Za-z0-9]{8})/.exec(location.pathname) || /[?&]c=([A-Za-z0-9]{8})/.exec(location.search);
  var code = m ? m[1].toUpperCase() : null;
  var intent = code ? 'intent://f/' + code + '#Intent;scheme=rally;package=app.rallyrating;S.browser_fallback_url=' + encodeURIComponent(PLAY_STORE) + ';end' : '';

  function $(id) { return document.getElementById(id); }

  function show(p) {
    $('loading').hidden = true;
    $('content').hidden = false;
    $('storeBtn').textContent = isIos ? T.getIos : isAndroid ? T.getAndroid : T.get;
    $('storeBtn').href = isAndroid ? PLAY_STORE : APP_STORE;
    $('openBtn').textContent = T.open;
    $('openBtn').href = isAndroid ? intent : 'rally://f/' + code;
    if (!p) {
      $('missing').hidden = false;
      $('title').textContent = T.notFound;
      $('lede').textContent = T.notFoundLede;
      $('openBtn').hidden = true;
      $('note').hidden = true;
      return;
    }
    $('eyebrow').textContent = T.eyebrow;
    // Ratings are four bare digits, never 1,240.
    $('meta').textContent = [p.rating ? String(p.rating) : null, p.city ? p.city.toUpperCase() : null].filter(Boolean).join(' · ');
    $('name').textContent = p.first;
    $('what').textContent = T.what;
    $('card').hidden = false;
    $('note').textContent = T.note;
  }

  if (code && isIos) { location.replace(APP_STORE); }
  else if (code && isAndroid) { location.replace(intent); }

  if (!code) { show(null); return; }
  fetch(SUPABASE_URL + '/rest/v1/rpc/friend_link_preview', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
    body: JSON.stringify({ p_code: code })
  }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (p) { show(p && p.id ? p : null); })
    .catch(function () { show(null); });
})();
</script>
</body>
</html>
