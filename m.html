<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Your match on RALLY</title>
<meta name="description" content="A match you played was logged on RALLY. Claim it." />
<meta property="og:title" content="Your match on RALLY" />
<meta property="og:description" content="A match you played was logged on RALLY. Tap to claim it." />
<!--
  RALLY · Match link (/m/CODE, rewritten here by vercel.json)

  Opened from the WhatsApp message a player sends after logging a match with
  someone who isn't on Rally yet. When the app is installed, iOS opens the app
  directly (universal link, /.well-known/apple-app-site-association) and this
  page never shows. When it isn't, this page shows the match, gets them the
  app, and keeps the code where they can find it.

  Reads the match through the public get_match_invite() function (first names,
  score and state only; an outsider sees "Luis G.", never a full name, and only
  while the match is open or recently counted).

  Getting the app: tapping the store button copies the code, and Rally's first
  screen offers Paste to open the match (on iPhone, Apple's own Paste button).
  Android also carries the code through the Play Store itself
  (referrer=rally_invite=CODE). Nothing about the phone or its connection is
  read or stored (the old network-and-screen note was dropped, migration 069).
-->
<style>
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/montserrat-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/montserrat-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:900;font-display:swap;src:url('/fonts/montserrat-latin-900-normal.woff2') format('woff2');}
  :root{
    --bg:#080808;--surf:#141414;--surf-2:#1A1A1A;--line:#1E1E1E;--line-2:#2A2A2A;
    --text:#F2F2F0;--dim:#888888;--muted:#555555;--acid:#CCFF00;--neg:#FF4444;
    --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center}
  a{color:inherit;text-decoration:none}
  main{width:100%;max-width:460px;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:22px}
  .mark{font-weight:900;font-size:20px;letter-spacing:.18em}
  .eyebrow{font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  h1{font-weight:900;font-size:30px;line-height:1.08;letter-spacing:-.03em;text-wrap:balance}
  p.lede{font-size:15px;line-height:1.5;color:var(--dim)}
  .card{background:var(--surf);border:.5px solid var(--line-2);border-radius:22px;padding:12px 16px}
  .card .meta{font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--muted);padding:4px 0 6px;text-transform:uppercase}
  .side{display:flex;align-items:center;gap:12px;padding:8px 0}
  .side + .side{border-top:.5px solid var(--line-2)}
  .names{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:10px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--surf-2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
  .av.g{background:transparent;border:1px dashed rgba(255,255,255,.28);color:var(--dim)}
  .nm{font-weight:900;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-weight:700;font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
  .sets{display:flex;gap:14px;align-items:center}
  .won{font-weight:900;font-size:9px;letter-spacing:.14em;color:var(--dim)}
  .set{font-weight:900;font-size:22px;min-width:16px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
  .set.w{color:var(--text)}
  .btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;font-weight:900;font-size:15px;letter-spacing:-.01em;border:0;cursor:pointer;width:100%;text-align:center}
  .btn.primary{background:var(--acid);color:#080808}
  .btn.quiet{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:14px}
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .code{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border:.5px solid var(--line-2);border-radius:14px;padding:14px 16px}
  .code b{display:block;font-weight:900;font-size:26px;letter-spacing:.22em;margin-top:4px;user-select:all}
  .code button{background:none;border:0;color:var(--dim);font:700 13px var(--font);cursor:pointer;padding:8px}
  .note{font-size:13px;line-height:1.5;color:var(--muted);text-align:center}
  .skeleton{background:var(--surf);border-radius:12px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="mark">RALLY</div>

  <section id="loading" aria-busy="true" style="display:flex;flex-direction:column;gap:14px">
    <div class="skeleton" style="height:12px;width:90px"></div>
    <div class="skeleton" style="height:64px;width:92%"></div>
    <div class="skeleton" style="height:210px;width:100%;border-radius:22px"></div>
  </section>

  <section id="content" hidden style="display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="card" id="card" hidden></div>
    <div class="code" id="codeBox" hidden>
      <div><div class="eyebrow" id="codeLabel"></div><b id="codeText"></b></div>
      <button type="button" id="copyBtn"></button>
    </div>
    <div class="actions">
      <a class="btn primary" id="openBtn" href="#"></a>
      <a class="btn quiet" id="storeBtn" href="#"></a>
      <p class="note" id="keepNote" hidden></p>
      <p class="note" id="note"></p>
    </div>
  </section>
</main>

<script>
(function () {
  var SUPABASE_URL = 'https://sbosbkbrkicpyktrzgjo.supabase.co';
  var KEY = 'sb_publishable_XLcXQNlCkK6xgNUkcn1wZQ_Lfp_rq5F';
  var APP_STORE = 'https://apps.apple.com/app/id6780019919';
  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=app.rallyrating';

  var es = /^es\b/i.test(navigator.language || '');
  document.documentElement.lang = es ? 'es' : 'en';
  var T = es ? {
    logged: function (n) { return n + ' ha apuntado un partido contigo'; },
    lede: 'Ya está guardado a tu nombre. Descarga Rally, toca tu nombre y es tuyo.',
    open: 'Abrir en Rally', getIos: 'Descargar en App Store', getAndroid: 'Descargar en Google Play', get: 'Descargar Rally',
    code: 'TU CÓDIGO', copy: 'Copiar', copied: 'Copiado',
    note: 'Si el enlace no abre la app después de instalarla, toca «¿Tienes un enlace o código de partido?» y pega este código.',
    keep: 'Al tocar, copiamos tu código. Abre Rally y toca Pegar en la primera pantalla.',
    counted: 'Este partido ya cuenta', countedLede: 'Abre Rally para verlo en tu historial.',
    lapsed: 'Este partido ha caducado', lapsedLede: 'Nadie del otro equipo lo confirmó en 14 días.',
    cancelled: 'Este partido se retiró', cancelledLede: 'No se movió ningún rating.',
    notFound: 'Ningún partido con ese enlace', notFoundLede: 'Revisa el enlace o pide que te lo vuelvan a enviar.',
    won: 'GANÓ', guest: 'AÚN SIN RALLY', on: 'EN RALLY', confirmed: 'CONFIRMADO',
    whichOne: '¿Cuál eres tú? ', or: ' o ', padel: 'PÁDEL', tennis: 'TENIS'
  } : {
    logged: function (n) { return n + ' logged a match with you'; },
    lede: 'It’s already saved under your name. Get Rally, tap your name and it’s yours.',
    open: 'Open in Rally', getIos: 'Get it on the App Store', getAndroid: 'Get it on Google Play', get: 'Get Rally',
    code: 'YOUR CODE', copy: 'Copy', copied: 'Copied',
    note: 'If the link doesn’t open the app after installing, tap “Got a match link or code?” and paste this code.',
    keep: 'Tapping copies your code. Open Rally and tap Paste on the first screen.',
    counted: 'This match counts', countedLede: 'Open Rally to see it in your history.',
    lapsed: 'This match lapsed', lapsedLede: 'Nobody on the other team confirmed it within 14 days.',
    cancelled: 'This match was withdrawn', cancelledLede: 'Nobody’s rating moved.',
    notFound: 'No match at this link', notFoundLede: 'Check the link, or ask for it to be sent again.',
    won: 'WON', guest: 'NOT ON RALLY YET', on: 'ON RALLY', confirmed: 'CONFIRMED',
    whichOne: 'Which one is you? ', or: ' or ', padel: 'PADEL', tennis: 'TENNIS'
  };

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIos = /iPhone|iPad|iPod/i.test(ua);
  var m = /\/m\/([A-Za-z0-9]{6})/.exec(location.pathname) || /[?&]c=([A-Za-z0-9]{6})/.exec(location.search);
  var code = m ? m[1].toUpperCase() : null;

  function $(id) { return document.getElementById(id); }
  function rpc(name, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
      body: JSON.stringify(body)
    });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  function show(state, data) {
    $('loading').hidden = true;
    $('content').hidden = false;
    // Android: the Play Store hands the code to the app on first open.
    var playWithCode = PLAY_STORE + (code ? '&referrer=' + encodeURIComponent('rally_invite=' + code) : '');
    var store = isAndroid ? playWithCode : APP_STORE;
    var appLink = isAndroid
      ? 'intent://m/' + code + '#Intent;scheme=rally;package=app.rallyrating;S.browser_fallback_url=' + encodeURIComponent(playWithCode) + ';end'
      : 'rally://m/' + code;
    var claimable = state === 'ok' && data && (data.status === 'waiting' || data.status === 'counted' || data.status === 'unrated');
    $('openBtn').textContent = T.open;
    $('openBtn').href = appLink;
    $('storeBtn').textContent = isIos ? T.getIos : isAndroid ? T.getAndroid : T.get;
    $('storeBtn').href = store;
    // Getting the app: copy the code on the way out. Rally's first screen
    // offers Paste. The store waits for the copy, never longer than 0.6s.
    $('storeBtn').addEventListener('click', function (e) {
      if (!claimable || !code || !navigator.clipboard) return;
      e.preventDefault();
      var gone = false;
      var go = function () { if (!gone) { gone = true; location.href = store; } };
      setTimeout(go, 600);
      try { navigator.clipboard.writeText(code).then(go, go); } catch (x) { go(); }
    });
    // iPhone: this page only shows when Rally isn't installed (with it, the
    // link opens the app), so getting the app is the main button there.
    if (isIos) {
      $('storeBtn').className = 'btn primary';
      $('openBtn').className = 'btn quiet';
      $('storeBtn').parentNode.insertBefore($('storeBtn'), $('openBtn'));
    }
    if (claimable && (isIos || isAndroid)) { $('keepNote').textContent = T.keep; $('keepNote').hidden = false; }

    if (state === 'notfound') {
      $('title').textContent = T.notFound; $('lede').textContent = T.notFoundLede;
      $('openBtn').hidden = true; $('note').hidden = true;
      return;
    }
    $('eyebrow').textContent = code;
    $('codeBox').hidden = false;
    $('codeLabel').textContent = T.code;
    $('codeText').textContent = code;
    $('copyBtn').textContent = T.copy;
    $('copyBtn').addEventListener('click', function () {
      var done = function () { $('copyBtn').textContent = T.copied; setTimeout(function () { $('copyBtn').textContent = T.copy; }, 1800); };
      try { navigator.clipboard.writeText(code).then(done, function () {}); } catch (e) {}
    });
    $('note').textContent = T.note;

    var st = data.status;
    if (st === 'counted' || st === 'unrated') { $('title').textContent = T.counted; $('lede').textContent = T.countedLede; }
    else if (st === 'lapsed') { $('title').textContent = T.lapsed; $('lede').textContent = T.lapsedLede; $('codeBox').hidden = true; $('note').hidden = true; }
    else if (st === 'cancelled') { $('title').textContent = T.cancelled; $('lede').textContent = T.cancelledLede; $('codeBox').hidden = true; $('note').hidden = true; }
    else {
      $('title').textContent = T.logged(data.logger);
      var open = (data.seats || []).filter(function (s) { return s.guest && !s.claimed; }).map(function (s) { return s.name; });
      $('lede').textContent = T.lede + (open.length > 1 ? ' ' + T.whichOne + open.slice(0, -1).join(', ') + T.or + open[open.length - 1].replace(/\.$/, '') + '.' : '');
    }
    renderCard(data);
  }

  function seatHtml(name, tag, guest) {
    return '<div class="p"><div class="av' + (guest ? ' g' : '') + '">' + esc((name || '?').charAt(0).toUpperCase()) +
      '</div><div style="min-width:0"><div class="nm">' + esc(name) + '</div><div class="tag">' + esc(tag) + '</div></div></div>';
  }
  function tagFor(s) { return s.confirmed ? T.confirmed : (s.guest && !s.claimed) ? T.guest : T.on; }

  function renderCard(d) {
    var by = {}; (d.seats || []).forEach(function (s) { by[s.seat] = s; });
    var sets = String(d.score || '').split(',');
    function setsHtml(top, won) {
      var h = won ? '<span class="won">' + T.won + '</span>' : '';
      sets.forEach(function (x) {
        var a = x.split('-'), mine = top ? a[0] : a[1], theirs = top ? a[1] : a[0];
        h += '<span class="set' + (Number(mine) > Number(theirs) ? ' w' : '') + '">' + esc(mine) + '</span>';
      });
      return '<div class="sets">' + h + '</div>';
    }
    var date = '';
    try { date = new Date(d.played_at).toLocaleDateString(es ? 'es-ES' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) {}
    var top = seatHtml(d.logger, T.on, false) + (by.partner ? seatHtml(by.partner.name, tagFor(by.partner), by.partner.guest && !by.partner.claimed) : '');
    var bottom = (by.opp1 ? seatHtml(by.opp1.name, tagFor(by.opp1), by.opp1.guest && !by.opp1.claimed) : '') +
                 (by.opp2 ? seatHtml(by.opp2.name, tagFor(by.opp2), by.opp2.guest && !by.opp2.claimed) : '');
    $('card').innerHTML =
      '<div class="meta">' + (d.sport === 'tennis' ? T.tennis : T.padel) + ' · ' + esc(date.toUpperCase()) + '</div>' +
      '<div class="side"><div class="names">' + top + '</div>' + setsHtml(true, d.logger_won) + '</div>' +
      '<div class="side"><div class="names">' + bottom + '</div>' + setsHtml(false, !d.logger_won) + '</div>';
    $('card').hidden = false;
  }

  if (!code) { show('notfound'); return; }
  rpc('get_match_invite', { p_code: code }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { d ? show('ok', d) : show('notfound'); })
    .catch(function () { show('notfound'); });
})();
</script>
</body>
</html>
