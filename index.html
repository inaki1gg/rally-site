<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RALLY — Know your game</title>
<meta name="description" content="RALLY. El lunes 7 de septiembre a las 21:00.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="RALLY — Know your game">
<meta property="og:description" content="El lunes 7 de septiembre a las 21:00.">
<meta property="og:url" content="https://www.rallyrating.app/">
<meta property="og:site_name" content="Rally">

<style>
/* Montserrat, self-hosted. Latin only — this page carries no other script.
   Same files the full homepage uses; see /home.html for the complete face set. */
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;
  src:url("/fonts/montserrat-latin-400-normal.woff2") format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;
  src:url("/fonts/montserrat-latin-700-normal.woff2") format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:900;font-display:swap;
  src:url("/fonts/montserrat-latin-900-normal.woff2") format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--field:#0D0D0D;--acid:#CCFF00;--white:#FFFFFF;--soft:#F2F2F0;--dim:#6B6B6B}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--field);color:var(--white);
  font-family:'Montserrat',system-ui,sans-serif;
  min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(28px,5vw,56px) clamp(24px,6vw,72px);
  position:relative;overflow-x:hidden;
}
/* the field: one faint radial lift — the same ellipse the film and the reels carry */
body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 48%,rgba(255,255,255,.028),rgba(255,255,255,0) 70%)}
body>*{position:relative}

.mark{font-weight:900;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em;line-height:1;
  color:var(--white);text-decoration:none;display:inline-block}
.mark span{color:var(--acid)}

main{padding:clamp(40px,7vw,80px) 0}
.kicker{font-weight:700;font-size:clamp(11px,1.5vw,15px);letter-spacing:.12em;color:var(--dim);
  margin-bottom:clamp(20px,3vw,34px)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,auto));justify-content:start;
  column-gap:clamp(36px,7vw,96px);row-gap:clamp(20px,3.4vw,40px)}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,auto))}}
.num{font-weight:900;font-size:clamp(64px,15vw,150px);line-height:.9;letter-spacing:-.025em;
  display:flex;min-height:1em}
.label{font-weight:700;font-size:clamp(11px,1.5vw,15px);letter-spacing:.12em;color:var(--dim);
  margin-top:clamp(10px,1.4vw,18px)}
/* the seconds are the live unit — acid means alive, and it is the only acid role in the frame */
.unit-s .num{color:var(--acid)}

/* a digit that changes drops into place. Squash, not blur: an isotropic blur on the acid
   would read as a glow, which the brand bans on letterforms. */
.digit{display:inline-block;transform-origin:50% 0}
.digit.tick{animation:flip .16s cubic-bezier(.22,1,.36,1) both}
@keyframes flip{from{transform:translateY(-.16em) scaleY(.66)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.digit.tick{animation:none}}

.line{margin-top:clamp(34px,5vw,64px);max-width:34ch}
.line p{font-weight:700;font-size:clamp(17px,2.2vw,26px);line-height:1.25;letter-spacing:-.01em;color:var(--soft)}
.line p+p{margin-top:6px;color:var(--dim);font-weight:400;font-size:clamp(14px,1.7vw,19px)}

footer.site{font-size:13px;color:var(--dim);line-height:1.9}
footer.site .links{display:flex;flex-wrap:wrap;gap:0 22px;margin-bottom:6px}
footer.site a{color:var(--dim);text-decoration:none}
footer.site a:hover{color:var(--soft)}
</style>
</head>
<body>

<a class="mark" href="/home">RALL<span>Y.</span></a>

<main>
  <div class="kicker">LUNES 7 SEP · 21:00</div>
  <div class="grid">
    <div class="unit"><div class="num" id="d">--</div><div class="label" id="ld">DÍAS</div></div>
    <div class="unit"><div class="num" id="h">--</div><div class="label" id="lh">HORAS</div></div>
    <div class="unit"><div class="num" id="m">--</div><div class="label">MIN</div></div>
    <div class="unit unit-s"><div class="num" id="s">--</div><div class="label">SEG</div></div>
  </div>
  <div class="line">
    <p>Un rating no se pone. Se confirma.</p>
    <p>A rating is not set. It is confirmed.</p>
  </div>
  <noscript>
    <div class="line"><p>Lunes 7 de septiembre, 21:00 CEST.</p></div>
  </noscript>
</main>

<!-- Footer pasted literally from /_partials/footer.html (English set). Real anchor tags:
     Apple's reviewer, crawlers and anyone with JavaScript blocked must all see them. -->
<footer class="site">
  <div class="links">
    <a href="/en/privacy">Privacy Policy</a>
    <a href="/en/terms">Terms and Conditions</a>
    <a href="/en/legal">Legal Notice</a>
    <a href="/en/support">Support</a>
  </div>
  <div>Rally Rating S.L. · Madrid · 2026</div>
</footer>

<script>
// The film lands Mon 7 Sep 2026, 21:00 Madrid. One constant; everything else is arithmetic.
var TARGET = Date.parse('2026-09-07T21:00:00+02:00');
var PER = { d: 86400000, h: 3600000, m: 60000, s: 1000 };
var prev = {};

function pad(n){ return n < 10 ? '0' + n : String(n); }

function paint(id, value){
  var el = document.getElementById(id), text = pad(value);
  if (prev[id] === text) return;                       // only a changed unit animates
  var first = prev[id] === undefined;
  prev[id] = text;
  el.textContent = '';
  for (var i = 0; i < text.length; i++){
    var span = document.createElement('span');
    span.className = first ? 'digit' : 'digit tick';
    span.textContent = text[i];
    el.appendChild(span);
  }
}

function tick(){
  var left = TARGET - Date.now();
  if (left <= 0){ location.replace('/home'); return; }  // at zero the site comes back
  var d = Math.floor(left / PER.d);
  var h = Math.floor(left % PER.d / PER.h);
  var m = Math.floor(left % PER.h / PER.m);
  var s = Math.floor(left % PER.m / PER.s);
  paint('d', d); paint('h', h); paint('m', m); paint('s', s);
  document.getElementById('ld').textContent = d === 1 ? 'DÍA'  : 'DÍAS';
  document.getElementById('lh').textContent = h === 1 ? 'HORA' : 'HORAS';
}

tick();
setInterval(tick, 250);
</script>
</body></html>
